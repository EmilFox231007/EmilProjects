<!DOCTYPE html>
<html>

<head>
    <title>AxonRooter</title>
    <style>
        canvas {
            max-width: 100%;
            display: block;
            margin: 1em 0;
            /* Remove width/height here, set via JS */
        }
    </style>
</head>

<body>
    <h1>AxonRooter Predictor</h1>
    <input type="file" id="fileInput" accept="image/*">
    <label for="scaleInput">Scale:</label>
    <input type="range" id="scaleInput" min="0.1" max="2" step="0.01" value="1">
    <span id="scaleValue">1.00</span>
    <br>
    <label for="opacityInput">Tip Opacity:</label>
    <input type="range" id="opacityInput" min="0" max="1" step="0.01" value="1">
    <span id="opacityValue">1.00</span>
    <canvas id="canvas"></canvas>

    <script>
        const fileInput = document.getElementById("fileInput");
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const scaleInput = document.getElementById("scaleInput");
        const scaleValue = document.getElementById("scaleValue");
        const opacityInput = document.getElementById("opacityInput");
        const opacityValue = document.getElementById("opacityValue");

        let img = null;
        let tips = [];
        let tipOpacity = 1.0;

        // Set a max display width for the canvas
        const MAX_DISPLAY_WIDTH = 1200;

        function drawImageAndTips(scale = 1) {
            if (!img) return;

            // Calculate base scale so image fits in MAX_DISPLAY_WIDTH
            const baseScale = Math.min(1, MAX_DISPLAY_WIDTH / img.width);
            const displayScale = baseScale * scale;

            // Set canvas internal size for sharp drawing
            canvas.width = img.width * displayScale;
            canvas.height = img.height * displayScale;

            // Set canvas display size (CSS)
            canvas.style.width = `${canvas.width}px`;
            canvas.style.height = `${canvas.height}px`;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            // Draw tips (swap x and y)
            ctx.save();
            ctx.globalAlpha = tipOpacity;
            tips.forEach(([y, x]) => {
                ctx.beginPath();
                ctx.arc(x * displayScale + (750 * displayScale), y * displayScale + (80 * displayScale), 4, 0, 2 * Math.PI);
                ctx.fillStyle = "red";
                ctx.fill();
            });
            ctx.restore();
        }

        fileInput.addEventListener("change", async (e) => {
            const file = e.target.files[0];
            tips = []; // Clear tips
            ctx.clearRect(0, 0, canvas.width, canvas.height); // Clear canvas
            if (!file) return;

            img = new Image();
            img.src = URL.createObjectURL(file);
            img.onload = async () => {
                drawImageAndTips(Number(scaleInput.value));

                const formData = new FormData();
                formData.append("file", file);

                const response = await fetch("/predict/", {
                    method: "POST",
                    body: formData,
                });

                const result = await response.json();
                tips = result.tips || [];
                drawImageAndTips(Number(scaleInput.value));
            };
        });

        scaleInput.addEventListener("input", () => {
            scaleValue.textContent = Number(scaleInput.value).toFixed(2);
            drawImageAndTips(Number(scaleInput.value));
        });

        opacityInput.addEventListener("input", () => {
            tipOpacity = Number(opacityInput.value);
            opacityValue.textContent = tipOpacity.toFixed(2);
            drawImageAndTips(Number(scaleInput.value));
        });
    </script>
</body>

</html>
