version: '3.8'

services:
  axonrooter-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3200:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    environment:
      - PYTHONPATH=/app/src
