[tool.poetry]
name = "axonrooter"
version = "0.1.0"
description = "An MVP Python package that detects root tips in petri dish images using computer vision."
authors = ["Endijs Kirsteins <endijs.kirsteins@gmail.com>", "Gabriel Won <gabrielwhn@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [
  { include = "axonrooter", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.9,<3.10"
fastapi = "0.115.12"
uvicorn = "0.34.2"
keras = "2.12.0"
tensorflow = "2.12.0"
numpy = "1.23.5"
opencv-python-headless = "4.11.0.86"
pillow = "11.2.1"
scikit-image = "0.24.0"
scikit-learn = "1.4.2"
patchify = "0.2.3"
matplotlib = "3.9.4"
networkx = "3.2.1"
skan = "0.11.1"
python-multipart = "0.0.20"
h5py = "3.13.0"
pydantic = "2.11.5"
starlette = "0.46.2"
tqdm = "4.67.1"
psutil = "7.0.0"
pandas = "2.2.3"

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
isort = "^6.0.1"
flake8 = "^7.2.0"
pytest = "^8.3.5"
mypy = "^1.15.0"
tox = "^4.26.0"

[build-system]
requires = ["poetry-core>=1.1.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 101
target-version = ["py39"]
skip-string-normalization = false

[tool.isort]
profile = "black"
line_length = 101
multi_line_output = 3
include_trailing_comma = true
known_first_party = ["axonrooter"]

[tool.flake8]
max-line-length = 80
extend-ignore = ["E203", "W503", "E501", "E402", "F401"]
exclude = [".git", "__pycache__", "build", "dist", ".venv"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.9"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py39

[testenv]
deps = pytest
commands = pytest
"""

[tool.poetry.scripts]
axonrooter = "axonrooter.cli:app"
